name: release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: lccodder/miniurl-api
  INFRA_REPO: LCcodder/k8s-autoscaling-benchmark
  VALUES_FILE: k8s/charts/api/values.yaml

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Bump image tag in infra repo
        working-directory: infra
        run: |
          yq -i '.image.tag = "${{ env.TAG }}"' "$VALUES_FILE"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "tag unchanged, nothing to commit"
            exit 0
          fi
          git add "$VALUES_FILE"
          git commit -m "api: bump image to ${{ env.TAG }}"
          git pull --rebase origin main
          git push origin HEAD:main